    body, html {

    * {

}

button,
a,
.clickable,
.arrow,
.checkbox,
[style*="cursor: pointer"] {

}

#game-viewport,
#game-viewport img,
#room-content img {

    -moz-user-select: none;

#game-viewport {

@font-face {

}

    .gradient-text {
    background: linear-gradient(90deg, #ff4d4d, #ffa64d, #ffff4d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
    @keyframes shake {
  0% { transform: translate(1px, 1px) rotate(0deg); }
  10% { transform: translate(-1px, -2px) rotate(-1deg); }
  30% { transform: translate(3px, 2px) rotate(0deg); }
  50% { transform: translate(-1px, 2px) rotate(1deg); }
  70% { transform: translate(3px, 1px) rotate(-1deg); }
  100% { transform: translate(1px, -2px) rotate(0deg); }
}

.effect-shake {
    display: inline-block;
    animation: shakeChar 0.1s infinite;
}

@keyframes shakeChar {
    0% { transform: translate(0px, 0px); }
    25% { transform: translate(2px, -1px); }
    50% { transform: translate(-1px, 2px); }
    75% { transform: translate(1px, -2px); }
    100% { transform: translate(0px, 0px); }
}

.effect-wave {
    display: inline-block;
    animation: waveChar 1.5s infinite ease-in-out;
}

@keyframes waveChar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

    #loading-screen {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 1s ease;
}

#title-screen {
    position: absolute;
    width: 1595px;
    height: 1099px;
    inset: 0;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    transition: opacity 1s ease;
}
#title-buttons {
    position: absolute;
    bottom: 100px;
    left: 550px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
    text-align: center;
    opacity: 0; 
    pointer-events: none;
    transition: opacity 0.8s ease;
}
    #fade-overlay {
    position: fixed;
    inset: 0;
    background: black;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease;
    z-index: 2;
}
    #fade-overlay.is-active {
    opacity: 1;
    pointer-events: all;
}

    
#black-curtain {
    position: fixed;
    top: -120%;
    left: 0;
    width: 100%;
    height: 120%;
    background: linear-gradient(to bottom, 
        rgba(0, 0, 0, 1) 0%, 
        rgba(0, 0, 0, 1) 80%, 
        rgba(0, 0, 0, 0) 100%);
    
    z-index: 9999;
    transition: transform 0.3s ease-in-out;
}

    .menu-btn {
    color: white !important;
    width: 900px; 
    height: 250px;
    display: block;
    margin: -20px auto;
    background: transparent;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    border: none;
    cursor: pointer;
    color: transparent;
    transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.4, 1);
}

.menu-btn:hover {
    transform: scale(1.3);
    background: transparent;
    color: white;
  -webkit-text-stroke: 2px black;
    animation: sketchy 0.12s infinite alternate;
}

    @keyframes sketchy {
    0% {
        text-shadow:
            -4px -4px 0 black,
             4px -3px 0 black,
            -3px  4px 0 black,
             3px  3px 0 black;
    }
    100% {
        text-shadow:
            -3px -3px 0 black,
             3px -4px 0 black,
            -4px  3px 0 black,
             4px  4px 0 black;
    }
}

    #loading-text {
        color: white;
        font-size: 100px;
        padding-left: 20px; 
        margin-bottom: 20px;
        text-shadow: 0 0 10px black;
        font-family: "Docallisme";
    }

    #progress-container {
        width: 60%;
        height: 20px;
        background: rgba(255,255,255,0.2);
        border-radius: 10px;
        overflow: hidden;
    }

    #progress-bar {
        width: 0%;
        height: 100%;
        background: white;
        transition: width 0.2s linear;
    }
    
    .flash {
    animation: flashAnim 2.5s infinite ease-in-out;
}

@keyframes flashAnim {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
}
    
.fade-in {
    animation: fadeInAnim 1s forwards ease;
}

@keyframes fadeInAnim {
    from { opacity: 0; }
    to { opacity: 0.8; }
}

    .menu-fade-in {

@keyframes menuFade {

    to { opacity: 0.1; }

function preloadAsset(src) {
    return new Promise((resolve) => {
        if (src.endsWith(".m4a") || src.endsWith(".mp3") || src.endsWith(".wav")) {
            const audio = new Audio();
            audio.oncanplaythrough = () => resolve(audio);
            audio.src = src;
            audio.load();
            return;
        }

        const img = new Image();
        img.src = src;

        img.onload = () => {
            img.decode()
                .then(() => {
                    resolve(img);
                })
                .catch(() => {
                    resolve(img);
                });
        };
    });
}

async function preloadAll() {
    const progressBar = document.getElementById("progress-bar");
    const gameViewport = document.getElementById("game-viewport");

    const promises = assets.map(async (src) => {
        const element = await preloadAsset(src);
        
        loaded++;
        const percent = Math.floor((loaded / assets.length) * 100);
        progressBar.style.width = percent + "%";

        if (src.includes("sprites/")) {
            const id = src.split('/').pop().split('.')[0]; 
            element.id = id; 
            element.className = "char"; 
            gameViewport.appendChild(element);
        }

        return element;
    });

    await Promise.all(promises);

    document.getElementById("loading-text").textContent = "LOADED!";
    await new Promise(r => setTimeout(r, 1000));

    document.getElementById("loading-screen").style.opacity = 0;
    setTimeout(showDisclaimer, 1000);
}

function updateFPS(currentTime) {
  frameCount++;
  const delta = currentTime - lastTime;

  if (delta >= 1000) {
    fps = Math.round((frameCount * 1000) / delta);
    
    if (settings.showFPS) {
      fpsDisplay.textContent = `FPS: ${fps}`;
    }
    
    frameCount = 0;
    lastTime = currentTime;
  }
  requestAnimationFrame(updateFPS);
}

    function startTypewriter(text, element, speaker = null, effect = null, onFinish = null, muted = false) {
  clearTimeout(_typingTimeout); 
  _isTyping = true;
  _fullTextToDisplay = text;
  _currentSpeaker = speaker;
  _currentEffect = effect;
  _currentOnFinish = onFinish;

  const speedMap = { 0: 60, 1: 30, 2: 10, 3: 0 };
  const config = speakerConfigs[speaker] || speakerConfigs['default'];
  const baseSpeed = speedMap[settings.speed];

  const charSound = new Audio(config.sound);
  charSound.volume = 0.5;

  let i = 0;
  element.innerHTML = "";

  function type() {
    if (i < text.length) {
      const char = text.charAt(i);
      const nextChar = text.charAt(i + 1);
      
      const span = document.createElement('span');
      span.className = 'dialog-char';
      span.textContent = char;
      
      if (effect === 'shaky') span.classList.add('effect-shake');
      if (effect === 'sine' || effect === 'wave') {
          span.classList.add('effect-wave');
          span.style.animationDelay = (i * 0.1) + 's';
      }
      
      element.appendChild(span);

      if (!muted && i % config.frequency === 0 && char !== " ") {
        const playClone = charSound.cloneNode();
        playClone.playbackRate = config.pitch;
        playClone.play().catch(e => {});
      }

      let currentDelay = baseSpeed;
      if (char === "." || char === "!" || char === "?") {
          if (nextChar !== "." && nextChar !== "!" && nextChar !== "?") {
              currentDelay += 500; 
          }
      } else if (char === ",") {
          currentDelay += 250;
      }

      i++;
      _typingTimeout = setTimeout(type, currentDelay);
    } else {
      finishTyping(element, onFinish);
    }
  }

  type();
}

    function finishTyping(element, onFinish = null) {
  clearTimeout(_typingTimeout);
  _isTyping = false;
  
  element.innerHTML = "";
  for (let i = 0; i < _fullTextToDisplay.length; i++) {
    const span = document.createElement('span');
    span.className = 'dialog-char';
    span.textContent = _fullTextToDisplay[i];
    if (_currentEffect === 'shaky') span.classList.add('effect-shake');
    if (_currentEffect === 'sine' || _currentEffect === 'wave') {
        span.classList.add('effect-wave');
        span.style.animationDelay = (i * 0.1) + 's';
    }
    if (_currentEffect === 'glitch') span.classList.add('effect-glitch');
    element.appendChild(span);
  }
  if (onFinish) onFinish();
}

function normalizeDialogLines(input, defaultStyle) {
  const rawLines = Array.isArray(input) ? input : [input];

  return rawLines.map(line => {
    if (typeof line === 'string') {
      return { 
        text: line, 
        speaker: null, mood: null, position: 'center',
        style: defaultStyle || 'dialog', triggers: [], choices: [] 
      };
    }
    return {
      speaker: line.speaker || null,
      mood: line.mood || null,
      position: line.position || 'center',
      text: line.text !== undefined ? String(line.text) : '',
      style: line.style || defaultStyle || 'dialog',
      effect: line.effect || null,
      background: line.background || null,
      ambience: line.ambience || null,
      track: line.track || null,
      triggers: line.triggers || [],
      next: line.next || null,
      branches: line.branches || null,
      newChapter: line.newChapter || false,
      choices: line.choices || []
    };
  });
}

    function handleTrigger(trig) {
    switch(trig.type) {
        case "sfx":
            new Audio(trig.value).play().catch(e => {});
            break;
        case "shake":
            document.body.style.animation = "none";
            setTimeout(() => { document.body.style.animation = "shake 0.5s"; }, 10);
            break;
        case "flash":
            const fx = document.getElementById("fade-overlay");
            fx.style.transition = "none";
            fx.style.background = "white";
            fx.style.opacity = 1;
            setTimeout(() => {
                fx.style.transition = "opacity 0.5s ease";
                fx.style.opacity = 0;
            }, 50);
            break;
            case "silent":
            if (_currentAmbience) {
                _currentAmbience.pause();
                _currentAmbience = null;
            }
            if (_currentTrack) {
                _currentTrack.pause();
                _currentTrack = null;
            }
            break;
            case "branch":
        handleBranch(trig);
        break;
            case "giveItem":
            if (inFreeplay) break;
    inventory.set(trig.key, (inventory.get(trig.key) || 0) + trig.value);
    break;

case "takeItem":
            if (inFreeplay) break;
    inventory.set(trig.key, Math.max(0, (inventory.get(trig.key) || 0) - trig.value));
    break;

case "requireItem":
    if (!inventory.get(trig.key)) {
    }
    break;
            case "song":
            startSong(trig.value);
            break;
        case "flag":
            if (inFreeplay) break;
            gameFlags[trig.key] = trig.value;
            break;
        case "meter":
            if (inFreeplay) break;
            meters[trig.key] += trig.value;
            console.log(`${trig.key} is now ${meters[trig.key]}`);
            break;
    }
}

function handleBranch(trig) {
    const condition = trig.flag ? gameFlags[trig.flag] : null;
    const meterValue = trig.meter ? meters[trig.meter] : null;

    let goTo = null;

    if (trig.flag) {
        goTo = condition ? trig.ifTrue : trig.ifFalse;
    } else if (trig.meter) {
        goTo = meterValue >= trig.min ? trig.ifTrue : trig.ifFalse;
    }

    if (goTo) {
        console.log("Branching to:", goTo);
        loadDialogue(goTo);
    }
}

function playBgMusic(type, data) {
    if (!data) return;

    let current = (type === 'ambience') ? _currentAmbience : _currentTrack;
    
    if (current && current.dataset.src === data.src) {
        current.volume = data.volume || 1.0;
        return;
    }

    if (current) {
        current.pause();
        current.remove();
    }

    const audio = new Audio(data.src);
    audio.loop = true;
    audio.volume = data.volume || 1.0;
    audio.dataset.src = data.src;
    audio.play().catch(e => console.error("play audio fuckass", e));

    if (type === 'ambience') _currentAmbience = audio;
    else _currentTrack = audio;
}

function doCommand(input) {
    const parts = input.trim().split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const args = parts.slice(1);

    switch (cmd) {
        case '/help':
            console.log("Commands: /show [scene], /pnc,  /give [item] [qty], /flag [key] [true/false], /meter [key] [val]");
            break;

        case '/show':
            console.log("Forcing dialogue:", args[0]);
            loadDialogue(args[0]);
            break;

            case '/pnc':
            console.log("Showing section:", args[0]);
            startPointNClick(args[0]);
            break;
                        
        case "/shake":
            document.body.style.animation = "none";
            setTimeout(() => { document.body.style.animation = "shake 0.5s"; }, 10);
            break;
                        
        case "/flash":
            const fx = document.getElementById("fade-overlay");
            fx.style.transition = "none";
            fx.style.background = "white";
            fx.style.opacity = 1;
            setTimeout(() => {
                fx.style.transition = "opacity 0.5s ease";
                fx.style.opacity = 0;
            }, 50);
        break;

        case '/give':
            const item = args[0];
            const qty = parseInt(args[1]) || 1;
            inventory.set(item, (inventory.get(item) || 0) + qty);
            console.log(`Inventory: ${item} is now ${inventory.get(item)}`);
            break;

        case '/flag':
            const key = args[0];
            const val = args[1] === "true";
            gameFlags[key] = val;
            console.log(`Flag ${key} set to ${val}`);
            break;

        case '/meter':
            const mKey = args[0];
            const mVal = parseInt(args[1]);
            meters[mKey] = mVal;
            console.log(`Meter ${mKey} set to ${mVal}`);
            break;

        default:
            console.log("Unknown command. Type /help");
    }
}

function applyColor(colorName) {
    if (colorName === 'blue') return '#414c89';

let pcMessageQueue = [];
let pcMessageInterval = null;

function showText(ptext) {
    if (Array.isArray(ptext)) {
        pcMessageQueue = pcMessageQueue.concat(ptext);
    } else {
        pcMessageQueue.push(ptext);
    }

    if (pcMessageFadeTimeout) {
        clearTimeout(pcMessageFadeTimeout);
        pcMessageFadeTimeout = null;
    }

    if (!pcMessageInterval) {
        processNextQueueLine();
        
        pcMessageInterval = setInterval(() => {
            if (pcMessageQueue.length > 0) {
                processNextQueueLine();
            } else {
                clearInterval(pcMessageInterval);
                pcMessageInterval = null;
                pcMessageFadeTimeout = setTimeout(() => {
                    const allActiveLines = textOverlay.getElementsByClassName("pc-message-line");
                    Array.from(allActiveLines).forEach(line => {
                        line.classList.add("fading");
                        setTimeout(() => { line.remove(); }, 500);
                    });
                    
                    pcMessageFadeTimeout = null;
                }, 4000);
            }
        }, 3000);
    }
}

function processNextQueueLine() {
    const ptext = pcMessageQueue.shift();
    if (!ptext) return;

    const textStr = ptext.text != null ? String(ptext.text) : '';
    const iconSrc = ptext.icon || null;
    const textColor = applyColor(ptext.color || 'green');

    const lineElement = document.createElement("div");
    lineElement.className = "pc-message-line";
    lineElement.style.color = textColor;

    if (iconSrc) {
        const iconElement = document.createElement("img");
        iconElement.src = `assets/pointnclick/icons/${iconSrc}`;
        iconElement.className = "pc-message-icon";
        lineElement.appendChild(iconElement);
    }

    const textSpan = document.createElement("span");
    textSpan.innerText = textStr;
    lineElement.appendChild(textSpan);

    textOverlay.appendChild(lineElement);

    const currentLines = textOverlay.getElementsByClassName("pc-message-line");
    if (currentLines.length > maxLines) {
        const oldestLine = currentLines[0];
        oldestLine.classList.add("fading");
        setTimeout(() => { oldestLine.remove(); }, 500);
    }
}

function calculateAccuracy(sicks, goods, bads, shits, misses) {
  const totalNotes = sicks + goods + bads + shits + misses;
  
  if (totalNotes === 0) return 0;
  
  const earnedPoints = (sicks * 1.0) + (goods * 0.75) + (bads * 0.5) + (shits * 0.25) + (misses * 0.0);
  
  const maxPoints = totalNotes * 1.0;
  const accuracy = (earnedPoints / maxPoints) * 100;
  
  return Number(accuracy.toFixed(2));
}

    function calculateGrade(accuracy) {
  const acc = Number(accuracy);

  if (acc >= 99.00) {
    return "SSS";
  } else if (acc >= 97.00) {
    return "SS";
  } else if (acc >= 95.00) {
    return "S";
  } else if (acc >= 90.00) {
    return "A";
  } else if (acc >= 80.00) {
    return "B";
  } else if (acc >= 70.00) {
    return "C";
  } else {
    return "D";
  }
}

            };

            let targetGroup = "";
            if (nameAttr.includes("miss")) {
                if (nameAttr.includes("left")) targetGroup = "miss-left";
                else if (nameAttr.includes("down")) targetGroup = "miss-down";
                else if (nameAttr.includes("up")) targetGroup = "miss-up";
                else if (nameAttr.includes("right")) targetGroup = "miss-right";
                else targetGroup = "miss";
            } 
            else if (nameAttr.includes("left")) targetGroup = "left";
            else if (nameAttr.includes("down")) targetGroup = "down";
            else if (nameAttr.includes("up")) targetGroup = "up";
            else if (nameAttr.includes("right")) targetGroup = "right";
            else if (nameAttr.includes("idle")) targetGroup = "idle";
            else {
                targetGroup = nameAttr.replace(/[\s_\d]+$/, "");
            }

            if (!charData.animations[targetGroup]) {
                charData.animations[targetGroup] = [];
            }

            charData.animations[targetGroup].push(frameMetrics);
        }

        await new Promise((resolve, reject) => {
            charData.imageObj.src = charData.src;
            charData.imageObj.onload = resolve;
            charData.imageObj.onerror = reject;
        });

    } catch (err) {
    }
}

let _specialAnimation = null;     
let _specialTarget = null;        
let _specialDurationTicks = 0;    

function triggerSpecial(target, animName, holdTicks) {
    const charData = (target === "player") ? _playerChar : _opponentChar;
    if (!charData || !charData.animations || !charData.animations[animName]) return;

    const totalFrames = charData.animations[animName].length;

    _specialTarget = target;
    _specialAnimation = animName;
    
    _specialDurationTicks = totalFrames * holdTicks; 
}

async function loadSongData(songId) {
    const base = `assets/final/songs/${songId}/`;
    const res = await fetch(base + "chart.json");
    if (!res.ok) {
        console.error("Failed to load chart.json for song:", songId);
        return null;
    }
    const json = await res.json();

    json.opponentPosition = json.opponentPosition || { x: 200, y: 1000 };
    json.playerPosition = json.playerPosition || { x: 1600, y: 1000 };

    if (json.stageLayers) {
        for (let layer of json.stageLayers) {
            layer.src = base + layer.src;
            
            if (layer.type === "animated" && layer.xml) {
                try {
                    const xmlRes = await fetch(base + layer.xml);
                    if (xmlRes.ok) {
                        const xmlText = await xmlRes.text();
                        
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                        const subTextures = xmlDoc.getElementsByTagName("SubTexture");
                        
                        layer.animationAtlas = {};

                        for (let i = 0; i < subTextures.length; i++) {
                            const node = subTextures[i];
                            const fullName = node.getAttribute("name");
                            if (!fullName) continue;

                            const match = fullName.match(/^(.*?)([\d]+)$/);
                            if (!match) continue;

                            const animName = match[1];

                            if (!layer.animationAtlas[animName]) {
                                layer.animationAtlas[animName] = [];
                            }

                            layer.animationAtlas[animName].push({
                                x: parseInt(node.getAttribute("x") || 0),
                                y: parseInt(node.getAttribute("y") || 0),
                                w: parseInt(node.getAttribute("width") || 0),
                                h: parseInt(node.getAttribute("height") || 0),
                                frameX: parseInt(node.getAttribute("frameX") || 0),
                                frameY: parseInt(node.getAttribute("frameY") || 0)
                            });
                        }
                    }
                } catch (xmlError) {
                    console.error("Failed to process layer XML inline:", xmlError);
                }
            }
        }
    } else {
        json.stageLayers = [{ id: "bg", type: "static", src: base + (json.background || "white.png"), zIndex: 1 }];
    }

    json.instSrc = base + json.instSrc;
    json.voicePlayer = base + json.voicePlayer;
    json.voiceOpponent = base + json.voiceOpponent;

    return json;
}

function updateCamera() {
    camera.x += (camera.targetX - camera.x) * camera.lerpSpeed;
    camera.y += (camera.targetY - camera.y) * camera.lerpSpeed;
    
    camera.zoom += (camera.targetZoom - camera.zoom) * camera.zoomSpeed;

    const maxX = camera.bounds.width - (camera.viewport.width / camera.zoom);
    const maxY = camera.bounds.height - (camera.viewport.height / camera.zoom);
    camera.x = Math.max(0, Math.min(camera.x, maxX));
    camera.y = Math.max(0, Math.min(camera.y, maxY));

    const container = document.getElementById("camera-container");
    if (container) {
        container.style.transform = `scale(${camera.zoom}) translate3d(${-camera.x}px, ${-camera.y}px, 0)`;
    }
}

    function autoFocusCamera(currentTime) {
    if (camera.manualCamera) return;

    const upcomingOpponentNotes = _activeSong.opponentNotes.filter(n => n[0] >= currentTime);
    const upcomingPlayerNotes = _activeSong.playerNotes.filter(n => n[0] >= currentTime);

    const nextOpponentTime = upcomingOpponentNotes.length > 0 ? upcomingOpponentNotes[0][0] : Infinity;
    const nextPlayerTime = upcomingPlayerNotes.length > 0 ? upcomingPlayerNotes[0][0] : Infinity;

    if (nextOpponentTime === Infinity && nextPlayerTime === Infinity) {
        camera.targetX = 256;
        camera.targetY = 1000;
        camera.targetZoom = 1.0;
        return;
    }

    if (nextOpponentTime <= nextPlayerTime) {
        camera.targetX = 0; 
        camera.targetY = 1000;
        camera.targetZoom = 1.1;
    } else {
        camera.targetX = 600; 
        camera.targetY = 1000;
        camera.targetZoom = 1.2;
    }
}

        function triggerCameraEvent(type, targetX, targetY, zoom, lerp = 0.05) {
    if (type === "MANUAL_PAN") {
        camera.manualCamera = true;
        camera.targetX = targetX;
        camera.targetY = targetY;
        camera.targetZoom = zoom;
        camera.lerpSpeed = lerp; 
    } 
    else if (type === "RELEASE_CAMERA") {
        camera.manualCamera = false;
        camera.lerpSpeed = 0.05;
    }
}



function updateRhythmLoop() {
    if (!_rhythmStarted || !_inst) return;

    if (_inst && _inst.ended && _rhythmStarted) {
        
        camera.manualCamera = true;
        camera.targetX = camera.x; 
        camera.targetY = 0;        
        camera.targetZoom = 1.1;   
        camera.lerpSpeed = 0.08;
        camera.zoomSpeed = 0.05;

        const fade = document.getElementById("fade-overlay");
        if (fade) {
            fade.style.zIndex = "999";
            fade.style.transition = "opacity 0.8s ease, background-color 0s linear";
            fade.style.backgroundColor = "black";
            fade.style.opacity = 1;
        }
        
        setTimeout(() => {
            showResults();
            fade.style.opacity = 0;
            const stage = document.getElementById("rhythm-stage");
            stage.style.display = "none";

        }, 800);
        
        return;
    }
    
    const currentTime = _inst.currentTime * 1000;
    const speed = _activeSong.scrollSpeed;

    if (_activeSong.events) {
        const holdTicks = 5;
        for (let i = 0; i < _activeSong.events.length; i++) {
            const ev = _activeSong.events[i];

            if (currentTime >= ev.time && !ev.hasFired) {
                if (ev.animation) {
                    triggerSpecial(ev.target, ev.animation, holdTicks);
                } 
                else if (ev.cameraCommand) {
                    if (ev.cameraCommand === "MANUAL_PAN") {
                        camera.manualCamera = true;
                        camera.targetX = ev.x || 0;
                        camera.targetY = ev.y || 1000;
                        camera.targetZoom = ev.zoom || 1.0;
                    } 
                    else if (ev.cameraCommand === "RELEASE_CAMERA") {
                        camera.manualCamera = false;
                    }
                }

                ev.hasFired = true; 
            }
        }
    }

    animateCharacters(currentTime);
    updateHPBar(currentTime);
    updateCamera();
    autoFocusCamera(currentTime);

    while (_activeSong.opponentNotes.length > 0 && _activeSong.opponentNotes[0][0] < currentTime + 2000) {
        createNoteElement(_activeSong.opponentNotes.shift(), false);
    }
    
    while (_activeSong.playerNotes.length > 0 && _activeSong.playerNotes[0][0] < currentTime + 2000) {
        createNoteElement(_activeSong.playerNotes.shift(), true);
    }

    const noteElements = document.querySelectorAll(".note");
    noteElements.forEach(el => {
        const targetTime = parseFloat(el.dataset.time);
        const diff = targetTime - currentTime;
       
        const y = 50 + (diff * speed);
        el.style.top = y + "px";
        const isPlayerLane = el.parentElement.id === "player-lanes";

        if (isPlayerLane) {
            const centerTimeOffset = 75 / speed;
            if (diff < -350 + centerTimeOffset) {
                if (!el.dataset.hit) {
                    hp = Math.max(0, hp - 10);
                    misses++;
                    combo = 0;
                    playMiss();

                    const lane = parseInt(el.dataset.lane);
                    const directionMap = ["miss-left", "miss-down", "miss-up", "miss-right"];
                    
                    if (directionMap[lane]) {
                        _playerMissAnimState = directionMap[lane];
                        _playerAnimationTimer = 350; 
                    }
                }
                el.remove();
            }
        }
        else { 
            const centerTimeOffset = 75 / speed;
            if (diff <= -centerTimeOffset) {
                const lane = parseInt(el.dataset.lane);
                const directionMap = ["left", "down", "up", "right"];
                
                if (directionMap[lane]) {
                    _opponentAnimState = directionMap[lane];
                    _opponentAnimTimer = 250;
                }
                el.remove(); 
            }
        }
    });

    const bodies = document.querySelectorAll(".sustain-body");
    bodies.forEach(el => {
        const headTime = parseFloat(el.dataset.time);
        const length = parseFloat(el.dataset.length);
        const diff = headTime - currentTime;

        const headY = 50 + (diff * speed);
        const height = length * speed;

        el.style.top = headY + "px";
        el.style.height = height + "px";

        if (diff < -length - 350) el.remove();
    });

    const ends = document.querySelectorAll(".sustain-end");
    ends.forEach(el => {
        const headTime = parseFloat(el.dataset.time);
        const length = parseFloat(el.dataset.length);
        const diff = headTime - currentTime;

        const headY = 50 + (diff * speed);
        const height = length * speed;

        const endHeight = 60;
        el.style.top = (headY + height - endHeight) + "px";

        if (diff < -length - 200) el.remove();
    });

    const playerLanes = document.getElementById("player-lanes");
    const frameDuration = 60;

    for (let i = splashes.length - 1; i >= 0; i--) {
        const splash = splashes[i];
        const elapsed = currentTime - splash.startTime;
        const currentFrame = Math.floor(elapsed / frameDuration);

        if (currentFrame >= 3) {
            if (splash.el) splash.el.remove();
            splashes.splice(i, 1);
            continue;
        }

        if (!splash.el && playerLanes) {
            const div = document.createElement("div");
            div.className = "note-splash-container";
            div.style.left = (splash.lane * 155) + "px";

            const img = document.createElement("img");
            img.src = `assets/final/splash_${splash.lane}.png`;
           
            div.appendChild(img);
            playerLanes.appendChild(div);
            splash.el = div;
        }

        if (splash.el) {
            const innerImg = splash.el.querySelector("img");
            if (innerImg) {
                innerImg.style.left = -(currentFrame * 300) + "px";
            }
        }
    }

    requestAnimationFrame(updateRhythmLoop);
}

    function drawCharacterFrame(ctx, charData, actionState, timeTick, holdTicks) {
    const animFrames = charData.animations[actionState];
    const activeFrames = (animFrames && animFrames.length > 0) ? animFrames : charData.animations["idle"];
    
    if (!activeFrames || activeFrames.length === 0) return;

    const currentFrameIndex = Math.floor(timeTick / holdTicks) % activeFrames.length;
    const frame = activeFrames[currentFrameIndex];

    ctx.drawImage(
        charData.imageObj,
        frame.x, frame.y, frame.w, frame.h, 
        0, 0, frame.w, frame.h              
    );
}

let _opponentAnimState = "idle";
let _opponentAnimTimer = 0;
let _playerAnimationTimer = 0;
let _lastPressedPlayerKey = null;
let _playerMissAnimState = null; 


    function animateCharacters(currentTime) {
    if (!_activeSong || !_playerChar || !_opponentChar) return;

    const bpm = _activeSong.bpm;
    const ticksPerBeat = 10;
    const tickRate = (bpm / 60) * ticksPerBeat;
    const holdTicks = 5;

    const t = currentTime / 1000;
    const tick = Math.floor(t * tickRate);

    _playerCtx.clearRect(0, 0, _playerCtx.canvas.width, _playerCtx.canvas.height);
    _opponentCtx.clearRect(0, 0, _opponentCtx.canvas.width, _opponentCtx.canvas.height);

    if (_specialDurationTicks > 0) {
        _specialDurationTicks--;
    } else {
        _specialTarget = null;
        _specialAnimation = null;
    }

    let playerState = "idle";
    
    if (_specialTarget === "player" && _specialAnimation) {
        playerState = _specialAnimation;
    } 
    else if (_playerAnimationTimer > 0 && _playerMissAnimState) {
        playerState = _playerMissAnimState;
        
        _playerAnimationTimer -= 16.6;
        if (_playerAnimationTimer <= 0) {
            _playerMissAnimState = null;
        }
    }
    else if (_playerAnimationTimer > 0 || _playerKey) {
        const activeKey = _playerKey || _lastPressedPlayerKey; 
        if (activeKey) {
            playerState = INPUT_MAP[activeKey.toUpperCase()] || "idle";
        }

        if (_playerAnimationTimer > 0) {
            _playerAnimationTimer -= 16.6; 
        }
    }

    drawCharacterFrame(_playerCtx, _playerChar, playerState, tick, holdTicks);


    let opponentState = "idle";

    if (_specialTarget === "opponent" && _specialAnimation) {
        opponentState = _specialAnimation;
    } 
    else if (_opponentAnimTimer > 0) {
        opponentState = _opponentAnimState;
        
        _opponentAnimTimer -= 16.6;
        
        if (_opponentAnimTimer <= 0) {
            _opponentAnimState = "idle";
        }
    }

    drawCharacterFrame(_opponentCtx, _opponentChar, opponentState, tick, holdTicks);

    if (_activeSong.stageLayers) {
        _activeSong.stageLayers.forEach(layer => {

            if (layer.type === "animated" && layer.animationAtlas) {
                const layerEl = document.getElementById(`layer-${layer.id}`);
                if (!layerEl) return;

                const animName = layer.activeAnimation || "idle";
                const frames = layer.animationAtlas[animName];
                
                if (frames && frames.length > 0) {
                    const currentFrameIndex = Math.floor(tick / holdTicks) % frames.length;
                    const frame = frames[currentFrameIndex];
                    
                    layerEl.style.width = `${frame.w}px`;
                    layerEl.style.height = `${frame.h}px`;
                    layerEl.style.backgroundPosition = `-${frame.x}px -${frame.y}px`;
                    
                    layerEl.style.transform = `translate(${frame.frameX}px, ${frame.frameY}px)`;
                }
            }
        });
    }
}



    
function updateHPBar(currentTime) {
    const hpPercent = hp / maxHP;
    const totalWidth = 930;

    document.getElementById("hp-green-wrapper").style.width = (hpPercent * 100) + "%";

    const splitX = 332.5 + (totalWidth * (1 - hpPercent));

    const pIcon = document.getElementById("icon-player");
    const oIcon = document.getElementById("icon-opponent");

    pIcon.style.left = (splitX - 125 + 100) + "px"; 
    oIcon.style.left = (splitX - 125 - 100) + "px";

    document.getElementById("stats-score").textContent = score;
    document.getElementById("stats-misses").textContent = misses;
    document.getElementById("stats-accuracy").textContent = accuracy;
    document.getElementById("stats-grade").textContent = grade;

    if (hp < 40) {
        pIcon.src = `assets/final/icon${_currentPlayerChar}-dying.png`;
    } else {
        pIcon.src = `assets/final/icon${_currentPlayerChar}-neutral.png`;
    }

    if (hp > 160) {
        oIcon.src = `assets/final/icon${_currentOpponentChar}-dying.png`;
    } else {
        oIcon.src = `assets/final/icon${_currentOpponentChar}-neutral.png`;
    }

    if (_activeSong) {
        const bpm = (_activeSong && _activeSong.bpm) ? _activeSong.bpm : 170;
        const msPerBeat = (60 / bpm) * 1000;
        const beatProgress = (currentTime % msPerBeat) / msPerBeat;

        let bounce = 1.0 - (beatProgress * 0.4); 
        if (bounce < 0.8) bounce = 0.8;

        pIcon.style.transform = `scale(${bounce})`;
        oIcon.style.transform = `scaleX(-${bounce}) scaleY(${bounce})`;
    }
}

loadGameData();
    
</script>
